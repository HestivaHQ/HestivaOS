name: PR quality gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-quality-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies and generate Prisma Client
        run: npm ci

      - name: Validate documentation policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/validate_documentation.py "$BASE_SHA" "$HEAD_SHA"

      - name: Scan tracked files for secrets
        run: npm run secrets:scan

      - name: Type-check all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Run workspace tests
        run: npm test

      - name: Build API workspace independently
        run: npm run build --workspace @hestiva/api

      - name: Build web workspace independently
        run: npm run build --workspace @hestiva/web

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
