name: PR quality gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-quality-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy-security-diff:
    name: Validate policy, secrets and diff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate documentation policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/validate_documentation.py "$BASE_SHA" "$HEAD_SHA"

      - name: Scan tracked files for secrets
        run: python3 scripts/scan_secrets.py

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

  api-validation:
    name: Validate API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies and generate Prisma Client
        run: npm ci
      - name: Type-check API workspace
        run: npm run typecheck --workspace @hestiva/api
      - name: Run API tests
        run: npm run test --workspace @hestiva/api
      - name: Build API workspace
        run: npm run build --workspace @hestiva/api

  web-cloudflare-validation:
    name: Validate web and Cloudflare bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies and generate Prisma Client
        run: npm ci
      - name: Type-check web workspace
        run: npm run typecheck --workspace @hestiva/web
      - name: Run web tests
        run: npm run test --workspace @hestiva/web
      - name: Generate Cloudflare types
        run: npm run cf-typegen --workspace @hestiva/web
      - name: Build OpenNext Cloudflare Worker
        run: npx opennextjs-cloudflare build
        working-directory: apps/web
      - name: Validate Wrangler bundle without deploying
        run: npx wrangler deploy --dry-run --config apps/web/wrangler.jsonc --outdir /tmp/hestiva-pr-validation

  postgres-migrations:
    name: Replay PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create isolated replay databases
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres hestiva_migration_clean
          createdb -h localhost -U postgres hestiva_migration_staged
      - name: Replay every migration from zero
        run: scripts/test_postgres_migrations.sh clean postgresql://postgres:postgres@localhost:5432/hestiva_migration_clean
      - name: Replay from the migration immediately before Slice 5K
        run: scripts/test_postgres_migrations.sh staged postgresql://postgres:postgres@localhost:5432/hestiva_migration_staged