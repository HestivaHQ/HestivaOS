name: Temporary Next.js lockfile regeneration

on:
  push:
    branches:
      - fix/nextjs-security-patch

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify Next.js lock entry
        run: node -e "const lock=require('./package-lock.json'); if(lock.packages?.['node_modules/next']?.version!=='16.3.4') process.exit(1)"
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile for Next.js 16.3.4"
          git push origin HEAD:fix/nextjs-security-patch
