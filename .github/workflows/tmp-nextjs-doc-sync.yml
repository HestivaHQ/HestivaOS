name: Temporary Next.js documentation sync

on:
  push:
    branches:
      - fix/nextjs-security-patch

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize current-state version references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in [Path('docs/ARCHITECTURE.md'), Path('docs/DEPLOYMENT.md')]:
              text = path.read_text()
              updated = text.replace('Next.js 16.3.0', 'Next.js 16.3.4')
              updated = updated.replace('peer range for 16.3.0', 'peer range for 16.3.4')
              path.write_text(updated)

          changelog = Path('docs/CHANGELOG.md')
          text = changelog.read_text()
          marker = '## 2026-09-02 — Next.js security patch\n'
          if marker not in text:
              entry = '''## 2026-09-02 — Next.js security patch\n\n### Security\n\n- Patched the HestivaOS web workspace from Next.js 16.3.0 to 16.3.4 and regenerated the npm lockfile with npm 11 on Node.js 24.\n- This removes the confirmed Critical Next.js exposure affecting releases before 16.3.3 while preserving the existing OpenNext 1.20.2, Wrangler 4.120.0, Turbopack, Cloudflare Worker and deployment-authority boundaries.\n- The post-regeneration npm audit still reports three high-severity findings elsewhere in the dependency graph; the broader dependency-security remediation roadmap item therefore remains open.\n\n'''
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
              changelog.write_text(text)
          PY
      - name: Commit synchronized documentation
        shell: bash
        run: |
          if git diff --quiet -- docs/ARCHITECTURE.md docs/DEPLOYMENT.md docs/CHANGELOG.md; then
            echo "Documentation already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md docs/DEPLOYMENT.md docs/CHANGELOG.md
          git commit -m "Document Next.js 16.3.4 security patch"
          git push origin HEAD:fix/nextjs-security-patch
