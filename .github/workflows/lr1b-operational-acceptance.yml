name: HestivaOS LR-1B Operational Acceptance

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Approved pre-launch HestivaOS origin'
        required: true
        type: string
      confirm_acceptance:
        description: 'Type RUN LR1B ACCEPTANCE to enable the destructive/mutating acceptance lane'
        required: true
        type: string
      scope:
        description: 'Run full acceptance or a focused deployed diagnostic'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - c2-diagnostic

permissions:
  contents: read

concurrency:
  group: hestivaos-production-lr1b
  cancel-in-progress: false

jobs:
  role-interface-foundation:
    name: LR-1B deployed acceptance
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.confirm_acceptance == 'RUN LR1B ACCEPTANCE') ||
        (github.event_name == 'push' && vars.HESTIVA_LR1B_AUTOMATION_ENABLED == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HESTIVA_LR1B_ACCEPTANCE_ENABLED: 'true'
      HESTIVA_LR1B_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || 'https://os.homent.co.za' }}
      HESTIVA_LR1B_API_URL: ${{ secrets.HESTIVA_LR1B_API_URL }}
      HESTIVA_LR1B_WEBSITE_INTEGRATION_SECRET: ${{ secrets.HESTIVA_LR1B_WEBSITE_INTEGRATION_SECRET }}
      HESTIVA_LR1B_ADMIN_EMAIL: ${{ secrets.HESTIVA_LR1B_ADMIN_EMAIL }}
      HESTIVA_LR1B_ADMIN_PASSWORD: ${{ secrets.HESTIVA_LR1B_ADMIN_PASSWORD }}
      HESTIVA_LR1B_SUPERVISOR_EMAIL: ${{ secrets.HESTIVA_LR1B_SUPERVISOR_EMAIL }}
      HESTIVA_LR1B_SUPERVISOR_PASSWORD: ${{ secrets.HESTIVA_LR1B_SUPERVISOR_PASSWORD }}
      HESTIVA_LR1B_TECHNICIAN_LEAD_EMAIL: ${{ secrets.HESTIVA_LR1B_TECHNICIAN_LEAD_EMAIL }}
      HESTIVA_LR1B_TECHNICIAN_LEAD_PASSWORD: ${{ secrets.HESTIVA_LR1B_TECHNICIAN_LEAD_PASSWORD }}
      HESTIVA_LR1B_TECHNICIAN_MEMBER_EMAIL: ${{ secrets.HESTIVA_LR1B_TECHNICIAN_MEMBER_EMAIL }}
      HESTIVA_LR1B_TECHNICIAN_MEMBER_PASSWORD: ${{ secrets.HESTIVA_LR1B_TECHNICIAN_MEMBER_PASSWORD }}
      HESTIVA_LR1B_EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Validate LR-1B acceptance configuration
        run: node apps/web/scripts/validate-lr1b-acceptance-env.mjs

      - name: Verify compatible revisions are deployed on web and API
        run: node apps/web/scripts/wait-for-lr1b-deployment.mjs

      - name: Install CI-only Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.54.2

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run full LR-1B acceptance lane
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'full' }}
        run: npx playwright test --config apps/web/playwright.acceptance.config.mjs --grep-invert 'C2 diagnostic proves'

      - name: Run targeted C2 diagnostic
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'c2-diagnostic') || github.event_name == 'push' }}
        run: npx playwright test --config apps/web/playwright.acceptance.config.mjs --project=admin-desktop apps/web/tests/acceptance/admin-property-preselection-diagnostic.spec.mjs

      - name: Retain bounded LR-1B failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: lr1b-failure-${{ github.run_id }}
          path: apps/web/test-results/lr1b-acceptance
          if-no-files-found: ignore
          retention-days: 3
