name: Temporary patched dependency audit

on:
  push:
    branches:
      - fix/nextjs-security-patch

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Collect npm audit diagnostics
        shell: bash
        run: |
          set +e
          npm audit
          full=$?
          npm audit --omit=dev
          prod=$?
          npm audit --json | tee npm-audit.json
          json=${PIPESTATUS[0]}
          echo "full=${full} prod=${prod} json=${json}" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload npm audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: patched-npm-audit-json
          path: npm-audit.json
          if-no-files-found: error
